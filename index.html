<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Index of /</title>
<style>
  :root{
    --bg:#1d1b18;
    --panel:#141312;
    --ink:#e8d9a8;
    --dim:#8d8163;
    --rule:#3a362e;
    --hot:#f2e3ad;
    --row:#262319;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* Light palette — delete the two comment markers on the next line to use it.
  :root{ --bg:#d6d2c8; --panel:#fbfaf6; --ink:#1c1a17; --dim:#6c665c;
         --rule:#c3bdb0; --hot:#000; --row:#eceadf; }
  */

  *,*::before,*::after{box-sizing:inherit}

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:14px/1.5 "DejaVu Sans Mono",Menlo,Consolas,"Liberation Mono",monospace;
    padding:16px 10px 40px;
  }

  .frame{
    max-width:1024px;
    margin:0 auto;
    background:var(--panel);
    border:1px solid var(--rule);
  }

  .head{
    display:flex;
    gap:0;
    align-items:center;
    padding:5px 10px;
    border-bottom:1px solid var(--rule);
    color:var(--dim);
    font-size:13px;
  }
  .head .n{flex:1 1 auto;min-width:0}
  .head .d{width:130px;flex:none}
  .head .s{width:80px;flex:none;text-align:right}
  .head .x{width:200px;flex:none;padding-left:18px}

  .bar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    padding:6px 10px;border-bottom:1px solid var(--rule);
  }
  .bar input{
    font:inherit;font-size:13px;padding:2px 6px;width:180px;
    background:var(--bg);color:var(--ink);border:1px solid var(--rule);
  }
  .bar button{
    font:inherit;font-size:12px;padding:2px 9px;cursor:pointer;
    background:var(--bg);color:var(--ink);border:1px solid var(--rule);
  }
  .bar button:hover{color:var(--hot);border-color:var(--dim)}
  .bar .fill{flex:1 1 auto}
  :focus-visible{outline:2px solid var(--hot);outline-offset:1px}

  .scroll{overflow-x:auto}
  .tree{min-width:640px}

  .row{display:flex;align-items:baseline;padding:1px 10px;white-space:pre}
  .row:hover{background:var(--row)}
  .row .n{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .row .d{width:130px;flex:none;color:var(--dim);font-size:13px}
  .row .s{width:80px;flex:none;text-align:right;color:var(--dim);font-size:13px}
  .row .x{width:200px;flex:none;padding-left:18px;color:var(--dim);font-size:13px;
          overflow:hidden;text-overflow:ellipsis}

  .guide{color:var(--rule)}
  .toggle{
    font:inherit;background:none;border:0;padding:0;cursor:pointer;
    color:var(--dim);
  }
  .toggle:hover{color:var(--hot)}
  .dir{color:var(--ink)}
  .file{color:var(--ink);text-decoration:none}
  .file:hover{color:var(--hot);text-decoration:underline}
  .nolink{color:var(--dim)}
  mark{background:none;color:var(--hot);text-decoration:underline}

  .foot{
    display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;
    padding:5px 10px;border-top:1px solid var(--rule);
    color:var(--dim);font-size:12px;
  }
  .msg{padding:22px 10px;text-align:center;color:var(--dim)}
</style>
</head>
<body>

<div class="frame">
  <div class="head">
    <span class="n">Name</span>
    <span class="d">Date Modified</span>
    <span class="s">Size</span>
    <span class="x">Description</span>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="find" aria-label="Find by name">
    <button type="button" id="all">expand all</button>
    <button type="button" id="none">collapse all</button>
    <span class="fill"></span>
    <span id="count"></span>
  </div>

  <div class="scroll"><div class="tree" id="tree"></div></div>
  <div class="msg" id="msg">Loading…</div>

  <div class="foot">
    <span id="stamp"></span>
    <span id="next"></span>
  </div>
</div>

<script>
const REFRESH_MS = 5 * 60 * 1000;
const ROOT_LABEL = 'Index of /';

let root = { name: ROOT_LABEL, folder: true, children: [], key: '' };
let generated = null;
let open = new Set(['']);            // expanded folder keys; root starts open
let nextAt = Date.now() + REFRESH_MS;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function bytes(n) {
  if (n === null || n === undefined) return '';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? Math.round(n) : n.toFixed(n < 10 ? 1 : 0)) + ' ' + u[i];
}

function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getDate()).padStart(2,'0')}-${m[d.getMonth()]}-${d.getFullYear()}`;
}

/** Flat list from files.json -> nested tree. */
function build(files) {
  const tree = { name: ROOT_LABEL, folder: true, children: [], key: '' };
  const folders = new Map([['', tree]]);

  // Folders first, so children always find a parent waiting for them.
  for (const f of files.filter((f) => f.folder)) {
    const key = [...(f.path || []), f.name].join('/');
    folders.set(key, { ...f, key, children: [] });
  }
  for (const f of files) {
    const parentKey = (f.path || []).join('/');
    const parent = folders.get(parentKey) || tree;
    parent.children.push(f.folder
      ? folders.get([...(f.path || []), f.name].join('/'))
      : { ...f, key: [...(f.path || []), f.name].join('/'), children: null });
  }

  const sort = (node) => {
    if (!node.children) return;
    node.children.sort((a, b) => {
      if (a.folder !== b.folder) return a.folder ? -1 : 1;
      return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
    });
    node.children.forEach(sort);
  };
  sort(tree);
  return tree;
}

function matches(node, q) {
  if (!q) return true;
  if (node.name.toLowerCase().includes(q)) return true;
  return (node.children || []).some((c) => matches(c, q));
}

/** Walk the tree into flat rows, drawing the ├─ └─ │ guides as we go. */
function rows(node, prefix, isLast, depth, q, out) {
  const expanded = open.has(node.key) || (q && depth > 0);
  const kids = (node.children || []).filter((c) => matches(c, q));

  if (depth > 0) {
    out.push({ node, prefix, isLast, expanded, hasKids: !!node.children });
  }
  if (node.children && (expanded || depth === 0)) {
    const nextPrefix = depth > 0 ? prefix + (isLast ? '    ' : '│   ') : '';
    kids.forEach((c, i) => rows(c, nextPrefix, i === kids.length - 1, depth + 1, q, out));
  }
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const out = [];
  rows(root, '', true, 0, q, out);

  const rootOpen = open.has('');
  const head =
    `<div class="row"><span class="n">` +
    `<button class="toggle" type="button" data-key="" aria-expanded="${rootOpen}">` +
    `[${rootOpen ? '−' : '+'}]</button> <span class="dir">${esc(ROOT_LABEL)}</span>` +
    `</span><span class="d"></span><span class="s"></span><span class="x"></span></div>`;

  const body = out.map(({ node, prefix, isLast, expanded, hasKids }) => {
    const guide = `<span class="guide">${prefix}${isLast ? '└── ' : '├── '}</span>`;
    let label;
    if (hasKids) {
      label = `<button class="toggle" type="button" data-key="${esc(node.key)}" ` +
              `aria-expanded="${expanded}">[${expanded ? '−' : '+'}]</button> ` +
              `<span class="dir">${mark(node.name, q)}/</span>`;
    } else if (node.url) {
      label = `    <a class="file" href="${esc(node.url)}">${mark(node.name, q)}</a>`;
    } else {
      label = `    <span class="nolink">${mark(node.name, q)}</span>`;
    }
    return `<div class="row">` +
      `<span class="n">${guide}${label}</span>` +
      `<span class="d">${when(node.modified)}</span>` +
      `<span class="s">${node.folder ? '' : bytes(node.size)}</span>` +
      `<span class="x">${esc(node.description || '')}</span>` +
      `</div>`;
  }).join('');

  $('tree').innerHTML = rootOpen || q ? head + body : head;

  const files = countFiles(root);
  $('count').textContent = files + (files === 1 ? ' file' : ' files');
  $('stamp').textContent = generated ? 'updated ' + when(generated) + ' ' +
    new Date(generated).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

  const empty = out.length === 0;
  $('msg').hidden = !empty;
  if (empty) $('msg').textContent = q ? 'No match.' : 'Nothing here yet.';
  tick();
}

function mark(name, q) {
  const safe = esc(name);
  if (!q) return safe;
  const i = name.toLowerCase().indexOf(q);
  if (i < 0) return safe;
  return esc(name.slice(0, i)) + '<mark>' + esc(name.slice(i, i + q.length)) +
         '</mark>' + esc(name.slice(i + q.length));
}

function countFiles(node) {
  if (!node.children) return 1;
  return node.children.reduce((n, c) => n + countFiles(c), 0);
}

function everyFolder(node, out = []) {
  if (node.children) {
    out.push(node.key);
    node.children.forEach((c) => everyFolder(c, out));
  }
  return out;
}

async function load() {
  try {
    const res = await fetch('files.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    root = build(data.files || []);
    generated = data.generated || null;
    render();                          // open folders stay open across refreshes
  } catch (err) {
    $('tree').innerHTML = '';
    $('msg').hidden = false;
    $('msg').textContent = 'Could not read files.json. Retrying shortly.';
  }
  nextAt = Date.now() + REFRESH_MS;
}

function tick() {
  const left = Math.max(0, nextAt - Date.now());
  $('next').textContent = `refresh in ${Math.floor(left / 60000)}:` +
    String(Math.floor((left % 60000) / 1000)).padStart(2, '0');
}

$('tree').addEventListener('click', (e) => {
  const t = e.target.closest('.toggle');
  if (!t) return;
  const key = t.dataset.key;
  open.has(key) ? open.delete(key) : open.add(key);
  render();
});

$('all').addEventListener('click', () => { open = new Set(everyFolder(root)); render(); });
$('none').addEventListener('click', () => { open = new Set(['']); render(); });
$('q').addEventListener('input', render);

load();
setInterval(load, REFRESH_MS);
setInterval(tick, 1000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && Date.now() > nextAt) load();
});
</script>
</body>
</html>
